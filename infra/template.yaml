AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Dialed: analog gauge reading agent. One Lambda (OpenCV 5 + the round agent) behind a Function URL,
  one DynamoDB table, one S3 bucket (site, media, deploy artifacts), one CloudFront distribution.
  Sized for the AWS free tier.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the Lambda zip (created by infra/deploy.py)
  CodeKey:
    Type: String
    Description: Key of the Lambda zip in CodeBucket
  LlmOrder:
    Type: String
    Default: bedrock
    Description: Model providers to try in order (bedrock, or off for the rule engine only)
  BedrockModels:
    Type: String
    Default: apac.amazon.nova-micro-v1:0,apac.amazon.nova-lite-v1:0
    Description: Bedrock models (inference profiles) to try in order; Nova Micro is the cheapest with tool use
  DailyModelCap:
    Type: Number
    Default: 400
    Description: Model-assisted captures per UTC day; after that the rule engine decides alone (spending guard)
  MaxConcurrency:
    Type: Number
    Default: 5
    Description: Reserved concurrency for the API function; caps compute spend if the URL is hammered

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-captures
            Status: Enabled
            Prefix: media/captures/
            ExpirationInDays: 120

  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: false }

  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: dialed
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${Bucket.Arn}/media/*"
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:Converse]
                Resource: "*"

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  Fn:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Runtime: python3.12
      Architectures: [arm64]
      Handler: api.handler.handler
      MemorySize: 3008
      Timeout: 60
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      Role: !GetAtt FnRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          DIALED_TABLE: !Ref Table
          DIALED_BUCKET: !Ref Bucket
          DIALED_LLM: !Ref LlmOrder
          DIALED_BEDROCK_MODELS: !Ref BedrockModels
          DIALED_LLM_DAILY_CAP: !Ref DailyModelCap
          OPENCV_LOG_LEVEL: ERROR

  FnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Fn.Arn
      AuthType: NONE

  FnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # since Oct 2025 a public function URL also needs lambda:InvokeFunction, granted only for calls through the URL
  FnUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Fn
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Dialed API errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Fn }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # /round/ -> /round/index.html (static export with trailing slashes)
  IndexFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index"
      AutoPublish: true
      FunctionConfig: { Comment: directory index, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.endsWith('/')) r.uri += 'index.html';
          else if (!r.uri.split('/').pop().includes('.')) r.uri += '/index.html';
          return r;
        }

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Dialed
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginPath: /site
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: media
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
          - Id: api
            DomainName: !Select [2, !Split ["/", !GetAtt FnUrl.FunctionUrl]]
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 60 }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexFn.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
            Compress: true
          - PathPattern: /media/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: [!Sub "${Bucket.Arn}/site/*", !Sub "${Bucket.Arn}/media/*"]
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}"

Outputs:
  SiteUrl:
    Value: !Sub "https://${Cdn.DomainName}"
  DistributionId:
    Value: !Ref Cdn
  Bucket:
    Value: !Ref Bucket
  Table:
    Value: !Ref Table
  FunctionUrl:
    Value: !GetAtt FnUrl.FunctionUrl
  FunctionName:
    Value: !Ref Fn
